global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

listen stats
    bind *:1936
    stats enable
    stats uri /
    stats refresh 5s

frontend http_front
    # Escucha en el puerto HTTP estándar (80)
    bind *:80

    # Redirige peticiones que inicien con /api al clúster de backend
    acl is_api path_beg /api
    use_backend fastapi_nodes if is_api

    # Por defecto, envía el resto del tráfico web al Frontend
    default_backend react_frontend_backend

# Backend para la aplicación React
backend react_frontend_backend
    server frontend_node frontend:3000 check

# Backend para el clúster de FastAPI
backend fastapi_nodes
    balance roundrobin
    server api1 api1:8000 check
    server api2 api2:8000 check
    server api3 api3:8000 check


