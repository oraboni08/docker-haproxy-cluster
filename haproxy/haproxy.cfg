global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

listen stats
    bind *:1936
    stats enable
    stats uri /
    stats refresh 5s

frontend http_front
    bind *:80
    default_backend fastapi_nodes

backend fastapi_nodes
    balance roundrobin
    server api1 api1:8000 check
    server api2 api2:8000 check
    server api3 api3:8000 check


